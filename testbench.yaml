laravel: '@testbench'

providers:
  # - Workbench\App\Providers\WorkbenchServiceProvider

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: false
    views: false
  build:
    - asset-publish
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
